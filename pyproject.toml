[project]
name = "openfrontbench"
version = "0.1.0"
description = "OpenFrontBench: a keyless MCP benchmark harness over the pinned OpenFrontIO engine."
readme = "README.md"
authors = [
    { name = "William Dennis", email = "wwdennis.home@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "harbor==0.21.0",
    "mcp>=1.0,<2",
    "pyyaml>=6",
]

[project.scripts]
openfront-harbor = "openfront_harbor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<10",
    "ruff>=0.14.10,<0.15",
    "ty>=0.0.42,<0.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
