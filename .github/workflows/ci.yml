name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --dev
      - name: Check formatting
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Hygiene (dev-tools check)
        run: uv run openfront-harbor dev-tools check
      - name: Type check
        run: uv run ty check
      - name: Test
        run: uv run pytest
      - name: Harbor + docker skeleton checks (guarded)
        run: |
          if [ -f scripts/build-openfront.sh ]; then bash scripts/build-openfront.sh --dry-run; fi
          if [ -f pyproject.toml ] && grep -q openfront-harbor pyproject.toml; then uv run openfront-harbor preflight; fi
      - name: Lit-review structure (guarded)
        run: |
          for t in tests/test_lit_review.py tests/test_lit_batch.py tests/test_lit_watch.py; do if [ -f "$t" ]; then uv run pytest "$t" -q; fi; done
      - name: Build
        run: uv build
